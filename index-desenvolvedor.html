<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio Digital - Lanchonete Express</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 pb-32 font-sans select-none text-gray-800">

  <!-- Header -->
  <header class="bg-red-600 text-white p-4 text-center sticky top-0 z-20 shadow-md">
    <h1 class="text-xl font-black tracking-wide">Lanchonete Express</h1>
    <p class="text-xs text-red-100 font-medium">Faça seu pedido online sem taxas</p>
  </header>

  <!-- Banner de Acompanhar Pedido Ativo (se houver) -->
  <div id="banner-acompanhar" class="max-w-md mx-auto px-4 pt-3 hidden">
    <a id="link-status-banner" href="status.html" class="bg-amber-500 hover:bg-amber-600 text-amber-950 px-4 py-2.5 rounded-xl text-xs font-black shadow flex items-center justify-between transition-all">
      <span class="flex items-center gap-2">
        <i data-lucide="radar" class="w-4 h-4 animate-pulse"></i> Acompanhar meu pedido ativo
      </span>
      <i data-lucide="chevron-right" class="w-4 h-4"></i>
    </a>
  </div>

  <!-- Lista de Produtos agrupados por Categoria (Acordeão) -->
  <main class="max-w-md mx-auto p-4" id="catalogo">
    <p class="text-center text-gray-500 mt-8 text-sm font-medium">Carregando cardápio...</p>
  </main>

  <!-- Barra Fixa de Finalização (Rodapé) -->
  <div id="footer-carrinho" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl flex justify-between items-center max-w-md mx-auto hidden z-20">
    <div>
      <span class="text-xs text-gray-400 block font-bold">Total:</span>
      <span class="text-lg font-black text-gray-900" id="total-carrinho">R$ 0,00</span>
    </div>
    <button onclick="abrirModalCheckout()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 px-6 rounded-xl shadow active:scale-95 transition-all flex items-center gap-2">
      <i data-lucide="shopping-bag" class="w-4 h-4"></i> Avançar Pedido
    </button>
  </div>

  <!-- MODAL DE CHECKOUT ELEGANTE (UI/UX NATIVA MOBILE-FIRST) -->
  <div id="modal-checkout" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-end sm:items-center justify-center hidden p-0 sm:p-4 transition-all">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-base font-black text-gray-900 flex items-center gap-2">
          <i data-lucide="clipboard-check" class="text-red-600 w-5 h-5"></i> Finalizar Pedido
        </h3>
        <button type="button" onclick="fecharModalCheckout()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-checkout" onsubmit="enviarPedido(event)" class="space-y-4">
        
        <!-- Tipo de Pedido: Delivery vs Retirada -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Como deseja receber?</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="cursor-pointer">
              <input type="radio" name="tipo_entrega" value="delivery" checked onchange="alternarTipoEntrega()" class="peer sr-only">
              <div class="p-3 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all flex flex-col items-center gap-1">
                <i data-lucide="bike" class="w-5 h-5 text-gray-600 peer-checked:text-red-600"></i>
                <span class="text-xs font-bold">Entrega (Delivery)</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="tipo_entrega" value="retirada" onchange="alternarTipoEntrega()" class="peer sr-only">
              <div class="p-3 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all flex flex-col items-center gap-1">
                <i data-lucide="store" class="w-5 h-5 text-gray-600 peer-checked:text-red-600"></i>
                <span class="text-xs font-bold">Retirar no Balcão</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Nome do Cliente -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Seu Nome</label>
          <input type="text" id="chk-nome" required placeholder="Ex: João Silva" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:outline-none focus:border-red-600">
        </div>

        <!-- Campo Endereço (Oculto se for Retirada) -->
        <div id="box-endereco">
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Endereço de Entrega</label>
          <input type="text" id="chk-endereco" placeholder="Rua, Número, Bairro e Complemento" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:outline-none focus:border-red-600">
        </div>

        <!-- Forma de Pagamento Discriminada -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1.5">Forma de Pagamento</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="forma_pagamento" value="Pix" checked onchange="alternarFormaPagamento()" class="peer sr-only">
              <div class="p-2.5 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all">
                <span class="text-xs font-bold block text-gray-700">⚡ Pix</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="forma_pagamento" value="Cartão de Débito" onchange="alternarFormaPagamento()" class="peer sr-only">
              <div class="p-2.5 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all">
                <span class="text-xs font-bold block text-gray-700">💳 Débito</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="forma_pagamento" value="Cartão de Crédito" onchange="alternarFormaPagamento()" class="peer sr-only">
              <div class="p-2.5 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all">
                <span class="text-xs font-bold block text-gray-700">💳 Crédito</span>
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="forma_pagamento" value="Dinheiro" onchange="alternarFormaPagamento()" class="peer sr-only">
              <div class="p-2.5 border-2 border-gray-200 rounded-xl peer-checked:border-red-600 peer-checked:bg-red-50 text-center transition-all">
                <span class="text-xs font-bold block text-gray-700">💵 Dinheiro</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Campo Dinâmico de Troco (Apenas visível se Dinheiro for selecionado) -->
        <div id="box-troco" class="hidden">
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Precisa de troco para quanto?</label>
          <input type="text" id="chk-troco" placeholder="Ex: R$ 50,00 ou Não preciso" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:outline-none focus:border-red-600">
        </div>

        <!-- Campo de Observação -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Observações do Pedido (Opcional)</label>
          <textarea id="chk-observacao" rows="2" placeholder="Ex: Sem cebola, molho à parte..." class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm focus:outline-none focus:border-red-600"></textarea>
        </div>

        <!-- Resumo de Total e Botão Final -->
        <div class="border-t pt-3 flex items-center justify-between">
          <div>
            <span class="text-xs text-gray-400 block font-bold">Total a pagar:</span>
            <span class="text-lg font-black text-gray-900" id="chk-total-modal">R$ 0,00</span>
          </div>
          <button type="submit" id="btn-confirmar-pedido" class="bg-green-600 hover:bg-green-700 text-white font-extrabold py-3 px-6 rounded-xl shadow active:scale-95 transition-all flex items-center gap-2">
            Confirmar Pedido <i data-lucide="check" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwiv1CzceVgKL3JOejjkHuwzhrChM9ZSkgKXU8Ee8axsBU9U0K53f7dzBLDfZPEuwU/exec";

    let produtos = [];
    let carrinho = {};
    const categoriasAbertas = new Set();

    function verificarPedidoAtivo() {
      const pedSalvo = localStorage.getItem('ultimo_pedido_id');
      if (pedSalvo) {
        document.getElementById('banner-acompanhar').classList.remove('hidden');
        document.getElementById('link-status-banner').href = `status.html?p=${encodeURIComponent(pedSalvo)}`;
      }
    }

    async function carregarProdutos() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        produtos = data.produtos || data || [];
        renderizarCardapio();
      } catch (err) {
        document.getElementById('catalogo').innerHTML = '<p class="text-red-500 text-center font-bold">Erro ao carregar cardápio.</p>';
      }
    }

    function toggleCategoria(categoria, estaAberto) {
      if (estaAberto) categoriasAbertas.add(categoria);
      else categoriasAbertas.delete(categoria);
    }

    function renderizarCardapio() {
      const container = document.getElementById('catalogo');

      const categorias = produtos.reduce((acc, p) => {
        const cat = p.categoria || "Outros";
        if (!acc[cat]) acc[cat] = [];
        acc[cat].push(p);
        return acc;
      }, {});

      let html = '';

      for (const [categoria, itens] of Object.entries(categorias)) {
        const isOpen = categoriasAbertas.has(categoria) ? 'open' : '';
        const catEscapada = categoria.replace(/'/g, "\\'");

        html += `
          <details ${isOpen} ontoggle="toggleCategoria('${catEscapada}', this.open)" class="group mb-4 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <summary class="flex justify-between items-center p-3.5 font-bold text-gray-800 cursor-pointer select-none bg-gray-50 hover:bg-gray-100 transition-colors list-none">
              <div class="flex items-center gap-2">
                <span class="w-1.5 h-5 bg-red-600 rounded-full"></span>
                <span class="text-base font-extrabold">${categoria}</span>
                <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-bold">${itens.length}</span>
              </div>
              <svg class="w-5 h-5 text-gray-400 transition-transform duration-200 group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </summary>

            <div class="p-3 space-y-3 border-t border-gray-100">
              ${itens.map(p => {
                const qtd = carrinho[p.id] || 0;
                return `
                  <div class="bg-white rounded-xl border border-gray-100 p-3 flex gap-3 items-center hover:border-gray-300 transition-colors">
                    <img src="${p.imagem || 'https://placehold.co/100'}" class="w-20 h-20 object-cover rounded-xl bg-gray-50 flex-shrink-0">
                    <div class="flex-1 min-w-0">
                      <h3 class="font-extrabold text-gray-800 text-sm truncate">${p.nome}</h3>
                      <p class="text-xs text-gray-400 line-clamp-2 mt-0.5 font-medium">${p.descricao}</p>
                      <span class="text-green-700 font-black text-sm block mt-1">R$ ${Number(p.preco).toFixed(2)}</span>
                    </div>
                    
                    <div class="flex items-center gap-2 bg-gray-50 p-1 rounded-xl border border-gray-200 flex-shrink-0">
                      ${qtd > 0 ? `
                        <button onclick="alterarQtd(${p.id}, -1)" class="w-7 h-7 bg-red-100 text-red-600 rounded-lg font-black text-sm flex items-center justify-center active:scale-90 transition-transform">-</button>
                        <span class="text-xs font-black text-gray-800 w-4 text-center">${qtd}</span>
                      ` : ''}
                      <button onclick="alterarQtd(${p.id}, 1)" class="w-7 h-7 bg-red-600 text-white rounded-lg font-black text-sm flex items-center justify-center active:scale-90 transition-transform">+</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </details>
        `;
      }

      container.innerHTML = html;
      atualizarBarra();
      lucide.createIcons();
    }

    function alterarQtd(id, delta) {
      const atual = carrinho[id] || 0;
      const novaQtd = atual + delta;
      if (novaQtd > 0) carrinho[id] = novaQtd;
      else delete carrinho[id];
      renderizarCardapio();
    }

    function obterTotalCarrinho() {
      let total = 0;
      for (const [id, qtd] of Object.entries(carrinho)) {
        const prod = produtos.find(p => p.id == id);
        if (prod) total += Number(prod.preco) * qtd;
      }
      return total;
    }

    function atualizarBarra() {
      const total = obterTotalCarrinho();
      const totalFormatado = `R$ ${total.toFixed(2)}`;
      document.getElementById('total-carrinho').innerText = totalFormatado;
      document.getElementById('chk-total-modal').innerText = totalFormatado;

      const footer = document.getElementById('footer-carrinho');
      if (total > 0) footer.classList.remove('hidden');
      else footer.classList.add('hidden');
    }

    function abrirModalCheckout() {
      document.getElementById('modal-checkout').classList.remove('hidden');
      alternarTipoEntrega();
      alternarFormaPagamento();
      lucide.createIcons();
    }

    function fecharModalCheckout() {
      document.getElementById('modal-checkout').classList.add('hidden');
    }

    function alternarTipoEntrega() {
      const tipo = document.querySelector('input[name="tipo_entrega"]:checked').value;
      const boxEndereco = document.getElementById('box-endereco');
      const inputEndereco = document.getElementById('chk-endereco');

      if (tipo === 'retirada') {
        boxEndereco.classList.add('hidden');
        inputEndereco.removeAttribute('required');
      } else {
        boxEndereco.classList.remove('hidden');
        inputEndereco.setAttribute('required', 'true');
      }
    }

    function alternarFormaPagamento() {
      const forma = document.querySelector('input[name="forma_pagamento"]:checked').value;
      const boxTroco = document.getElementById('box-troco');
      if (forma === 'Dinheiro') {
        boxTroco.classList.remove('hidden');
      } else {
        boxTroco.classList.add('hidden');
      }
    }

    async function enviarPedido(event) {
      event.preventDefault();

      const btn = document.getElementById('btn-confirmar-pedido');
      btn.innerText = "Processando Pedido...";
      btn.disabled = true;

      const nome = document.getElementById('chk-nome').value.trim();
      const tipo = document.querySelector('input[name="tipo_entrega"]:checked').value;
      const endereco = tipo === 'retirada' ? "🥡 Retirada no Balcão" : document.getElementById('chk-endereco').value.trim();
      const formaPgto = document.querySelector('input[name="forma_pagamento"]:checked').value;
      const troco = formaPgto === 'Dinheiro' ? document.getElementById('chk-troco').value.trim() : "";
      const obs = document.getElementById('chk-observacao').value.trim();

      let total = 0;
      const linhasItens = [];
      for (const [id, qtd] of Object.entries(carrinho)) {
        const prod = produtos.find(p => p.id == id);
        if (prod) {
          linhasItens.push(`• ${qtd}x ${prod.nome}`);
          total += Number(prod.preco) * qtd;
        }
      }

      const totalFormatado = `R$ ${total.toFixed(2)}`;
      const itensFormatados = linhasItens.join('\n');
      const idTemp = "#" + Math.floor(1000 + Math.random() * 9000);

      try {
        const payload = JSON.stringify({
          pedido: idTemp,
          cliente: nome,
          itens: itensFormatados,
          total: totalFormatado,
          endereco: endereco,
          pagamento: formaPgto,
          trocoPara: troco,
          tipoEntrega: tipo,
          observacao: obs
        });

        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload
        });

        const resposta = await res.json();
        const idFinal = (resposta && resposta.pedido) ? resposta.pedido : idTemp;

        // Salva localmente para acesso imediato com 1 clique
        localStorage.setItem('ultimo_pedido_id', idFinal);
        carrinho = {};

        // REDIRECIONA DIRETO PARA MONITORAMENTO DE STATUS (SEM ABRIR WHATSAPP FORÇADO)
        window.location.href = `status.html?p=${encodeURIComponent(idFinal)}`;

      } catch (err) {
        console.error("Erro ao processar pedido:", err);
        alert("Erro de conexão ao enviar o pedido. Tente novamente.");
        btn.innerText = "Confirmar Pedido";
        btn.disabled = false;
      }
    }

    verificarPedidoAtivo();
    carregarProdutos();
  </script>
</body>

</html>
